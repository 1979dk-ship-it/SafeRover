; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without this, `pio run` would build every environment, including the bench
; sketches. The rover firmware stays the default; the others are built on
; request with -e.
default_envs = esp32doit-devkit-v1

; Settings shared by every environment. Kept in one place so the board and
; platform cannot drift apart between the firmware and the bench sketches.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Keep the monitor off the DTR/RTS lines. On this board they drive EN and
; GPIO0 through the auto-reset transistors, so a monitor that asserts them
; reboots the ESP32 into flash-download mode and the output goes silent.
monitor_dtr = 0
monitor_rts = 0

; The rover firmware. Builds src/ as usual.
;
; The display libraries are declared here rather than in [env] on purpose: the
; scanner has no display and pulling them in would compile a graphics library
; into a sketch that only walks the bus. Versions are pinned so a later release
; cannot change behaviour under a build that already works.
[env:esp32doit-devkit-v1]
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.12.1

; One-shot hardware check, flashed on its own when the I2C bus needs proving.
; The filter drops src/ entirely and compiles only the scanner, so the two
; never share a setup() and the scanner never reaches the vehicle.
;   pio run -e i2c-scanner -t upload
[env:i2c-scanner]
build_src_filter = -<*> +<../tools/i2c_scanner/>
